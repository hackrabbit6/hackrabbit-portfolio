<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #08090c;
      }
      .og {
        align-items: center;
        background: #08090c;
        display: flex;
        height: 630px;
        justify-content: space-between;
        overflow: hidden;
        padding: 76px 84px;
        position: relative;
        width: 1200px;
      }
      .glow-a,
      .glow-b {
        border-radius: 50%;
        position: absolute;
      }
      .glow-a {
        background: radial-gradient(circle, rgba(242, 178, 102, 0.22), rgba(242, 178, 102, 0) 70%);
        height: 620px;
        right: -120px;
        top: -180px;
        width: 620px;
      }
      .glow-b {
        background: radial-gradient(circle, rgba(95, 191, 174, 0.12), rgba(95, 191, 174, 0) 70%);
        bottom: -220px;
        height: 520px;
        left: -140px;
        width: 520px;
      }
      .left {
        max-width: 640px;
        position: relative;
        z-index: 1;
      }
      .brand {
        color: #eceae4;
        font-family: Georgia, 'Songti SC', 'STSong', serif;
        font-size: 104px;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      /* 夜间地图的等高线地形（docs/NIGHT-MAP.md） */
      .terrain {
        background: repeating-linear-gradient(176deg, transparent 0 17px, rgba(142, 147, 158, 0.22) 17px 18px);
        bottom: -40px;
        height: 340px;
        left: -60px;
        -webkit-mask-image: linear-gradient(transparent, #000 70%);
        mask-image: linear-gradient(transparent, #000 70%);
        position: absolute;
        right: -60px;
        transform: perspective(600px) rotateX(48deg);
        transform-origin: 50% 100%;
      }
      .brand span {
        color: #f2b266;
      }
      .tagline {
        color: #eceae4;
        font-family: 'Songti SC', 'STSong', Georgia, serif;
        font-size: 42px;
        line-height: 1.4;
        margin-top: 34px;
      }
      .tagline b {
        color: #f2b266;
        font-weight: 600;
      }
      .meta {
        color: #a3a6ae;
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 22px;
        letter-spacing: 0.02em;
        margin-top: 30px;
      }
      .right {
        align-items: center;
        display: flex;
        flex: none;
        justify-content: center;
        position: relative;
        z-index: 1;
      }
      .ring {
        border: 1px solid rgba(242, 178, 102, 0.55);
        border-radius: 50%;
        box-shadow: 0 0 0 10px rgba(242, 178, 102, 0.08), 0 0 80px rgba(242, 178, 102, 0.22);
        height: 380px;
        overflow: hidden;
        width: 380px;
      }
      .ring img {
        display: block;
        height: 100%;
        object-fit: cover;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="glow-a"></div>
      <div class="glow-b"></div>
      <div class="terrain"></div>
      <div class="left">
        <div class="brand">hack<span>rabbit</span></div>
        <p class="tagline">帮普通人看懂 <b>AI 时代</b>里<br />和自己有关的变化。</p>
        <p class="meta">前端工程师 / 独立开发 · hackrabbit.cc.cd</p>
      </div>
      <div class="right">
        <div class="ring"><img src="../../public/avatar.webp" alt="" /></div>
      </div>
    </div>
  </body>
</html>
